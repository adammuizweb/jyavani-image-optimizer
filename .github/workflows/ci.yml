name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, pdo, zip
          coverage: none
      - name: Lint PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run contracts
        run: for test in tests/*_contract.php; do php "$test"; done
      - name: Build package
        run: php tools/build-package.php "$RUNNER_TEMP/jyavani-image-optimizer-0.1.0.zip"
